name: Deploy to VPS

# Auto-deploy Wishnet to the Hostinger VPS on every push to main.
# The VPS pulls the latest code and rebuilds the Docker container behind Traefik.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            cd /root/wishnet
            GIT_SSH_COMMAND="ssh -i /root/.ssh/wishnet_deploy -o StrictHostKeyChecking=accept-new" git -C app pull --ff-only
            docker compose up -d --build
            docker image prune -f
